<div class="page-container">
  <h1 class="page-title">Contact Us</h1>
  <p class="page-description">
    Have a question or want to work together? We'd love to hear from you. Fill out the form below and our team will get back to you as soon as possible.
  </p>
  
  <form style="margin-top: 2rem; max-width: 600px; display: flex; flex-direction: column; gap: 1rem;">
    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
      <label for="name" style="font-weight: 600; color: #333;">Name</label>
      <input type="text" id="name" placeholder="Your Name" style="padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;">
    </div>
    
    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
      <label for="email" style="font-weight: 600; color: #333;">Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" style="padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;">
    </div>
    
    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
      <label for="message" style="font-weight: 600; color: #333;">Message</label>
      <textarea id="message" rows="5" placeholder="How can we help?" style="padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; resize: vertical;"></textarea>
    </div>
    
    <button type="button" class="btn btn-primary" style="align-self: flex-start; margin-top: 0.5rem;">Send Message</button>
  </form>
</div>
